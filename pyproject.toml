[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silences"
version = "1.0.0"
description = "Code, models and records behind 'Playing the Silences': gap segmentation for word-level decoding of TEMPO Morse"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lucas S. Hindman" }]
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "matplotlib", "nltk"]

[project.optional-dependencies]
train = ["torch", "snntorch"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["silences*"]
